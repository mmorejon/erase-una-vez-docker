# https://docs.docker.com/compose/compose-file/
services:
  server-a:
    image: ghcr.io/mmorejon/erase-una-vez-2:v0.5.0
    entrypoint: server
    platform: linux/amd64
    environment:
      CHARACTER: "server a"
    networks:
      - tier-a
  client-a:
    image: ghcr.io/mmorejon/erase-una-vez-2:v0.5.0
    entrypoint: client
    platform: linux/amd64
    environment:
      ENDPOINT: "http://server-a:8000/echo"
    networks:
      - tier-a
  server-b:
    image: ghcr.io/mmorejon/erase-una-vez-2:v0.5.0
    entrypoint: server
    platform: linux/amd64
    environment:
      CHARACTER: "server b"
    networks:
      - tier-b
  client-b:
    image: ghcr.io/mmorejon/erase-una-vez-2:v0.5.0
    entrypoint: client
    platform: linux/amd64
    environment:
      ENDPOINT: "http://server-b:8000/echo"
    networks:
      - tier-b

networks:
  tier-a:
  tier-b:
